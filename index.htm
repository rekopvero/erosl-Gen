<!DOCTYPE html>
<html>
<head>
    <title>Silly Auto-Lore Generator</title>
</head>
<body>

    <h1>SillyTavern Auto-Lore Generator</h1>

    <input type="file" id="cardPicker">

    <button id="generateBtn">Generate Lore</button>
    <script>
        const fileInput = document.getElementById("cardPicker");
        const actionBtn = document.getElementById("generateBtn");
        actionBtn.addEventListener("click", function () {
            alert(fileInput.value);
        });
    </script>
</body>
</html>
