<!DOCTYPE html>
<html>
<head>
    <title>Silly Auto-Lore Generator</title>
</head>
<body>

    <h1>SillyTavern Auto-Lore Generator</h1>

    <input type="file" id="cardPicker">

    <button id="generateBtn">Generate Lore</button>
    <script>
        const actionBtn = document.getElementById("generateBtn");
        actionBtn.addEventListener("click", function () {
            const fileInput = document.getElementById("cardPicker");
            const theFile = fileInput.files[0];

            if (!theFile) {
                alert("Hey! Pick a character card file first!");
                return;
            }

            const destBox = new FormData();
            destBox.append('characterCard', theFile);

            fetch('/upload', {
                method: 'POST',
                body: destBox

            }).then(function (response) {
                alert("FILE CREATED!")
            });
  
        });
    </script>
</body>
</html>
